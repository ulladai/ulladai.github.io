
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Funny Prank 😂</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #17172d, #7628a8);
    }

    .card {
      width: 85%;
      max-width: 400px;
      padding: 30px 20px;
      border-radius: 25px;
      background: rgba(255,255,255,0.12);
      box-shadow: 0 10px 35px #0005;
    }

    .emoji {
      font-size: 75px;
    }

    h1 {
      color: #ffe66d;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 15px 25px;
      margin-top: 15px;
      background: #ffdf45;
      color: #24133d;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      display: none;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="emoji">😈</div>

    <h1>HEY YOU! 😂</h1>

    <p>Someone has a special message for you!</p>

    <button onclick="showPrank()">
      CLICK HERE 👀
    </button>

    <div id="message">
      <h1>YOU GOT PRANKED! 🤣</h1>
      <p>Hahaha! ullu banaya bada majja aaya! 😂</p>
      <p>Relax, it's just a joke. ❤️</p>
      <div class="emoji">🤡</div>
    </div>
  </div>

  <script>
    function showPrank() {
      document.getElementById("message").style.display = "block";
    }
  </script>
</body>
</html>

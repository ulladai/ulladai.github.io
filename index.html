
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Special Surprise 🎁</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at top, #32104d, #090611 65%);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 480px;
  text-align: center;
  padding: 35px 22px;
  border: 1px solid #c34bff;
  border-radius: 25px;
  background: #130d20eF;
  box-shadow: 0 0 35px #a020f044;
  animation: appear 1s ease;
}

.gift {
  font-size: 85px;
  display: inline-block;
  animation: float 2s ease-in-out infinite;
}

h1 {
  font-size: clamp(30px, 8vw, 44px);
  margin: 18px 0;
}

.pink {
  color: #ff64d8;
  text-shadow: 0 0 15px #ff28bb77;
}

p {
  color: #ded6e9;
  font-size: 17px;
  line-height: 1.6;
}

.note {
  padding: 15px 10px;
  border-radius: 14px;
  background: #ffffff0b;
  border: 1px solid #ffffff12;
  margin: 25px 0;
}

button {
  width: 100%;
  max-width: 310px;
  padding: 17px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  border: 0;
  border-radius: 40px;
  cursor: pointer;
  background: linear-gradient(100deg, #ff3158, #a52cff);
  box-shadow: 0 0 25px #e32aff55;
  transition: transform .2s;
}

button:hover {
  transform: scale(1.05);
}

.hint {
  color: #ff75d8;
  font-size: 14px;
  margin-top: 22px;
}

#surprise {
  display: none;
}

.finger {
  font-size: clamp(145px, 42vw, 220px);
  line-height: 1.15;
  margin: 10px 0;
  animation: slam .65s cubic-bezier(.2,1.7,.5,1);
  filter: drop-shadow(0 0 22px #ff1744);
}

.roast {
  color: #ff304c;
  font-size: clamp(36px, 10vw, 55px);
  text-shadow: 0 0 20px #ff002f77;
  font-weight: 1000;
  animation: shake .5s ease-in-out;
}

.small {
  font-size: 15px;
  color: #cbbbd8;
}

#again {
  margin-top: 15px;
  background: linear-gradient(100deg, #8e21dd, #f32672);
}

.confetti {
  position: fixed;
  top: -35px;
  z-index: 5;
  pointer-events: none;
  animation: fall 3s linear forwards;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-12px) rotate(5deg); }
}

@keyframes appear {
  from { opacity: 0; transform: translateY(18px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slam {
  from { transform: scale(0) rotate(-25deg); }
  to { transform: scale(1) rotate(0); }
}

@keyframes shake {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-3deg); }
  75% { transform: rotate(3deg); }
}

@keyframes fall {
  to { transform: translateY(110vh) rotate(600deg); opacity: 0; }
}
</style>
</head>

<body>
<main class="card">

  <section id="welcome">
    <div class="gift">🎁</div>

    <h1>HEY YOU! <span class="pink">😉</span></h1>

    <p>I have something <span class="pink">special</span> for you...</p>

    <div class="note">
      ✨ A little surprise is waiting for you! ✨
    </div>

    <button onclick="reveal()">
      CLICK HERE 👀 →
    </button>

    <div class="hint">Go on... click it! 💜</div>
  </section>

  <section id="surprise">
    <p class="pink">SURPRISE REVEALED! 🎉</p>

    <div class="finger">🖕</div>

    <div class="roast">FUCK Uhhh Santoshi Madarchod! 😂</div>

    <p>HAHAHA! YOU REALLY CLICKED IT! 🤣</p>

    <div class="note">
      Congratulations! 🎖️<br>
      You just got officially PRANKED!
    </div>

    <p class="small">Relax bro, it's just a joke. ❤️</p>

    <button id="again" onclick="resetPrank()">
      SEE THE SURPRISE AGAIN 😈
    </button>
  </section>

</main>

<script>
function reveal() {
  document.getElementById("welcome").style.display = "none";
  document.getElementById("surprise").style.display = "block";

  for (let i = 0; i < 45; i++) {
    const item = document.createElement("div");
    item.className = "confetti";
    item.textContent = ["😂", "💜", "✨", "🤣", "🎉"][
      Math.floor(Math.random() * 5)
    ];

    item.style.left = Math.random() * 100 + "vw";
    item.style.animationDuration = (2 + Math.random() * 3) + "s";
    item.style.fontSize = (18 + Math.random() * 20) + "px";

    document.body.appendChild(item);
    setTimeout(() => item.remove(), 5000);
  }
}

function resetPrank() {
  document.getElementById("surprise").style.display = "none";
  document.getElementById("welcome").style.display = "block";
}
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUCK Uhhh.... 😂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  background: radial-gradient(circle, #591515, #100000 75%);
}

.card {
  width: 92%;
  max-width: 500px;
  padding: 25px 15px;
  border: 2px solid #ff3030;
  border-radius: 25px;
  background: #200909;
  box-shadow: 0 0 35px #ff1010aa;
  animation: appear .7s ease-out;
}

.finger {
  font-size: clamp(120px, 35vw, 210px);
  line-height: 1.2;
  animation: bounce 1.2s infinite alternate;
  filter: drop-shadow(0 0 15px #ff3030);
}

h1 {
  margin: 10px 0;
  font-size: clamp(38px, 10vw, 65px);
  color: #ff3333;
  font-weight: 1000;
  text-shadow: 3px 3px #650000;
}

p {
  font-size: 19px;
  line-height: 1.5;
}

button {
  padding: 15px 25px;
  border: 0;
  border-radius: 40px;
  color: white;
  background: #ed2020;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #ff5555;
  transform: scale(1.05);
}

#extra {
  display: none;
  font-size: 27px;
  color: #ffe66d;
  font-weight: bold;
  margin-top: 18px;
}

.particle {
  position: fixed;
  top: -40px;
  font-size: 30px;
  pointer-events: none;
  animation: fall linear forwards;
}

@keyframes bounce {
  from { transform: rotate(-8deg) scale(.95); }
  to { transform: rotate(8deg) scale(1.08); }
}

@keyframes appear {
  from { opacity: 0; transform: scale(.7); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes fall {
  to {
    transform: translateY(110vh) rotate(500deg);
    opacity: 0;
  }
}
</style>
</head>

<body>
<div class="card">
  <div class="finger">🖕</div>

  <h1>FUCK UFF!</h1>

  <p>OI HERO! 😂 K SOCHERA LINK KHOLIS?</p>

  <button onclick="prank()">THICHA TA! 😈</button>

  <div id="extra">
    HAHAHA! U GOT ROASTED! 🤣
    <div>🖕 🖕 🖕</div>
    <p>JUST A PRANK, BRO! 🔥</p>
  </div>
</div>

<script>
function prank() {
  document.getElementById("extra").style.display = "block";

  for (let i = 0; i < 35; i++) {
    const item = document.createElement("div");
    item.className = "particle";
    item.textContent = ["🖕", "😂", "🔥", "💀"][
      Math.floor(Math.random() * 4)
    ];
    item.style.left = Math.random() * 100 + "vw";
    item.style.animationDuration = (2 + Math.random() * 3) + "s";
    document.body.appendChild(item);

    setTimeout(() => item.remove(), 5000);
  }
}
</script>
</body>
</html>
